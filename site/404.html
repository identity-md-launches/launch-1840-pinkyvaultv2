<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinky</title>
<meta name="robots" content="noindex">
<script>
  // A promise made a few minutes ago has no page of its own yet: send its link to the board.
  var m = /^\/p\/(\d+)\/?$/.exec(location.pathname);
  location.replace(m ? '/#p' + m[1] : '/');
</script>
</head>
<body style="margin:0;background:#5E1224;color:#F4EEDD;font:18px system-ui,sans-serif">
<p style="padding:24px"><a href="/" style="color:#E79AA8">Go to Pinky</a></p>
</body>
</html>
